services:
  frame-tv-sync:
    # Prebuilt from this fork on GitHub Container Registry. If the package is
    # private, run `docker login ghcr.io` first (see README), or make the
    # package public in the repo's package settings.
    # To build locally instead, comment out `image:` and uncomment `build:`.
    image: ghcr.io/tddostu/frame-tv-artwork-sync:latest
    # build: .
    restart: unless-stopped
    environment:
      # Comma-separated list of TV IP addresses
      TV_IPS: "192.168.1.100,192.168.1.101"

      # How often to check and sync (in minutes)
      SYNC_INTERVAL_MINUTES: "5"

      # Matte style: none, shadowbox_polar, modern_apricot, etc.
      MATTE_STYLE: "none"

      # Optional: Slideshow Control
      # Uncomment to override TV's slideshow settings:
      # SLIDESHOW_ENABLED: "true"
      # SLIDESHOW_INTERVAL: "15"  # Use value supported by your TV (e.g., 3, 15, 60, 720, 1440)
      # SLIDESHOW_TYPE: "shuffle"  # shuffle or sequential

      # Optional: Brightness Control (choose one)
      # Manual brightness (fixed value):
      # BRIGHTNESS: "5"  # Use value supported by your TV model (commonly 0-10 or 0-50)

      # Solar-based brightness (automatic):
      # SOLAR_BRIGHTNESS_ENABLED: "true"
      # LOCATION_LATITUDE: "42.3601"
      # LOCATION_LONGITUDE: "-71.0589"
      # LOCATION_TIMEZONE: "America/New_York"
      # BRIGHTNESS_MIN: "2"
      # BRIGHTNESS_MAX: "10"

      # Cleanup Control: Remove images from TV that aren't in the artwork folder
      # When true, ensures TV only shows images from your local folder
      # When false, preserves any existing images already on the TV
      REMOVE_UNKNOWN_IMAGES: "false"

      # Optional: Client name shown in the TV's authorized devices list
      # CLIENT_NAME: "FrameTVArtworkSync"

      # Optional: local HTTP control API for Homebridge power on/off.
      # Published on the host loopback only (see `ports` below), so it is not
      # exposed to the LAN. A host-networked Homebridge reaches it at
      # http://127.0.0.1:8080/tv/<ip>/...  A bridge-networked Homebridge can
      # instead join the "frame-control" network and use http://frame-tv-sync:8080
      CONTROL_API_ENABLED: "true"
      CONTROL_API_PORT: "8080"

      # Optional: Auto-Off Control
      # Turn off TVs at a specific time, but only when in art mode.
      # TVs being used for other content (e.g., HDMI) are left alone.
      # Requires LOCATION_TIMEZONE to be set.
      # AUTO_OFF_TIME: "22:00"        # Time to turn off (24-hour format)
      # AUTO_OFF_GRACE_HOURS: "2"     # Hours after AUTO_OFF_TIME to keep trying

      # Optional: Auto-On Control
      # For a fresh install, leave the TV in normal TV/HDMI viewing and approve
      # both prompts. IP Control approval is automatic but requires normal viewing.
      # AUTO_ON_TIME: "07:00"
      # WOL_BROADCAST_ADDRESS: "255.255.255.255"  # Fallback when deep standby closes IP Control
    ports:
      # Control API on the host loopback so a host-networked Homebridge
      # (network_mode: host) can reach it without exposing it on the LAN.
      # Drop the "127.0.0.1:" prefix to allow other hosts on the network.
      - "127.0.0.1:8080:8080"
    volumes:
      # Map your local artwork folder to /artwork in container
      - ./artwork:/artwork

      # Persist TV authentication tokens
      - ./tokens:/tokens
    networks:
      - frame-control

# Only needed if Homebridge is bridge-networked and joins this network (see the
# control API comment above). A host-networked Homebridge uses the published
# loopback port instead, so this block can be removed. The fixed name lets a
# separate Compose project join it as external: docker network create frame-control
networks:
  frame-control:
    name: frame-control
